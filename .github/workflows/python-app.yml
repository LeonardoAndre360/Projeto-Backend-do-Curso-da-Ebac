name: CI/CD - FastAPI Tests & Docker Build

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: fastapi-app:latest

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar o Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Instalar dependências com Poetry
        run: poetry install --no-root --no-interaction

      - name: Rodar testes com Pytest
        run: poetry run pytest

      - name: Construir a imagem Docker (Docker Build)
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Validar execução do container (Docker Run)
        run: |
          docker run -d --name fastapi-test ${{ env.IMAGE_NAME }}
          sleep 5
          docker ps | grep fastapi-test
          docker stop fastapi-test